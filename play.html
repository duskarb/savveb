<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>archivve player</title>
  <!-- Loaded up front: the runtime registers its service worker on the window load event. -->
  <script src="replay/ui.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --line: #111111;
      --mark: #d7dad6;
      --font: Arial, "Helvetica Neue", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111111; --text: #eeeeee; --muted: #999999; --line: #eeeeee; --mark: #3a3d39; }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }

    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      text-transform: uppercase;
    }
    .bar a { color: inherit; text-decoration: none; white-space: nowrap; }
    .bar a:hover { background: var(--mark); }
    .bar > div { flex: 1 1 auto; min-width: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #title { font-weight: 700; }
    #meta { color: var(--muted); margin-left: 8px; text-transform: none; }

    .frame { flex: 1 1 auto; min-height: 0; display: flex; }
    .frame[hidden], .open[hidden] { display: none; }
    .frame replay-web-page { flex: 1 1 auto; width: 100%; height: 100%; display: block; }

    .open {
      margin: auto;
      width: min(560px, calc(100vw - 32px));
      padding: 40px 0;
      display: grid;
      gap: 16px;
    }
    .open h1 { margin: 0; font-size: 14px; text-transform: uppercase; font-weight: 400; }
    .open p { margin: 0; color: var(--muted); line-height: 1.45; }

    .drop {
      display: grid;
      place-items: center;
      min-height: 180px;
      border: 1px dashed var(--line);
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
      padding: 16px;
    }
    .drop.over, .drop:hover { background: var(--mark); }
    .drop input { display: none; }

    form { display: grid; grid-template-columns: minmax(0, 1fr) max-content; border: 1px solid var(--line); }
    form input, form button { font: inherit; color: inherit; background: var(--bg); border: 0; min-height: 40px; padding: 0 10px; }
    form button { border-left: 1px solid var(--line); cursor: pointer; text-transform: uppercase; }
    form button:hover { background: var(--mark); }

    .message { margin: auto; padding: 40px 16px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="bar">
    <a href="index.html">Archive list</a>
    <div><strong id="title">Player</strong><span id="meta"></span></div>
    <a id="original" href="#" target="_blank" rel="noopener" hidden>Original</a>
    <a id="another" href="play.html" hidden>Open another</a>
  </header>

  <main class="frame" id="frame">
    <section class="open" id="open">
      <h1>Replay a web archive</h1>
      <p>Open a <code>.wacz</code> file (or <code>.warc</code> / <code>.warc.gz</code>). The file stays in
        this browser; nothing is uploaded.</p>
      <label class="drop" id="drop">
        <input id="file" type="file" accept=".wacz,.warc,.gz,.har,.json">
        <span>Drop a file here, or click to choose</span>
      </label>
      <form id="url-form">
        <input id="url-input" type="url" placeholder="…or paste the URL of a .wacz file" required>
        <button type="submit">Open</button>
      </form>
      <p>Remote files must allow cross-origin access (CORS) and range requests. GitHub Pages and
        most static hosts do.</p>
    </section>
    <!-- The player element must exist before the page finishes loading, or the runtime
         never initializes. It waits here, hidden, until a source is chosen. -->
    <div class="frame" id="stage" hidden><replay-web-page id="player" replaybase="replay/"></replay-web-page></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);

    function message(text) {
      $("frame").innerHTML = "";
      const box = document.createElement("section");
      box.className = "message";
      box.textContent = text;
      $("frame").appendChild(box);
    }

    // url = the page inside the archive to start on. Without it, ReplayWeb.page shows
    // its own page list and address bar so any captured page can be browsed.
    function play({ source, url = "", title = "", meta = "" }) {
      if (!("serviceWorker" in navigator)) {
        message("This browser cannot replay archives here: open this page over http(s), not file://.");
        return;
      }
      document.title = title || "archivve player";
      $("title").textContent = title || "Archive";
      $("meta").textContent = meta;
      $("original").hidden = !url;
      if (url) $("original").href = url;
      $("another").hidden = false;

      if (!customElements.get("replay-web-page")) {
        message("The replay runtime is missing (replay/ui.js).");
        return;
      }
      const player = $("player");
      if (url) {
        player.setAttribute("url", url);
        player.setAttribute("embed", "replayonly");
      }
      player.setAttribute("source", source);
      $("open").hidden = true;
      $("stage").hidden = false;
    }

    function formatSize(bytes) {
      if (bytes < 1048576) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / 1048576).toFixed(1)} MB`;
    }

    function openFile(file) {
      if (!file) return;
      // ReplayWeb.page reads blob: URLs directly; the file never leaves this tab.
      play({ source: URL.createObjectURL(file), title: file.name, meta: formatSize(file.size) });
    }

    const source = params.get("source");
    if (source) {
      play({
        source: new URL(source, location.href).href,
        url: params.get("url") || "",
        title: params.get("title") || "",
        meta: params.get("meta") || params.get("student") || "",
      });
    } else {
      const drop = $("drop");
      $("file").addEventListener("change", (event) => openFile(event.target.files[0]));
      drop.addEventListener("dragover", (event) => { event.preventDefault(); drop.classList.add("over"); });
      drop.addEventListener("dragleave", () => drop.classList.remove("over"));
      drop.addEventListener("drop", (event) => {
        event.preventDefault();
        drop.classList.remove("over");
        openFile(event.dataTransfer.files[0]);
      });
      $("url-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const next = new URL(location.href);
        next.search = new URLSearchParams({ source: $("url-input").value.trim() }).toString();
        location.href = next.href;
      });
    }
  </script>
</body>
</html>
