<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Archive</title>
    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #666666;
        --line: #111111;
        --soft-line: #dddddd;
        --mark: #d7dad6;
        --font: Arial, "Helvetica Neue", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --text: #eeeeee;
          --muted: #999999;
          --line: #eeeeee;
          --soft-line: #333333;
          --mark: #3a3d39;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.35;
      }

      a { color: inherit; }

      .shell {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 14px 0 56px;
      }

      .topbar, .masthead, .toolbar, .list-head, .archive-row {
        border-bottom: 1px solid var(--line);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 12px;
        text-transform: uppercase;
      }
      .topbar a { text-decoration: none; }
      .topbar a:hover { background: var(--mark); }

      .masthead {
        display: grid;
        grid-template-columns: minmax(0, 1fr) max-content;
        gap: 20px;
        padding: 16px 0 18px;
      }

      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 400;
        text-transform: uppercase;
      }

      .subtitle, .summary, .status { color: var(--muted); }
      .subtitle { margin: 12px 0 0; max-width: 620px; }

      .summary {
        display: grid;
        gap: 6px;
        min-width: 160px;
        text-align: right;
        text-transform: uppercase;
      }

      .toolbar {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(150px, 220px) minmax(150px, 220px) max-content;
        align-items: center;
      }

      label {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 10px;
        align-items: center;
        min-height: 44px;
        padding-right: 12px;
        border-right: 1px solid var(--line);
        text-transform: uppercase;
      }
      label:last-of-type { border-right: 0; }

      input, select, button { font: inherit; color: inherit; background: var(--bg); }

      input[type="search"] { width: 100%; height: 36px; border: 0; padding: 0 8px; }
      select { max-width: 100%; }

      button {
        min-height: 44px;
        border: 0;
        border-left: 1px solid var(--line);
        padding: 0 12px;
        cursor: pointer;
        text-transform: uppercase;
      }
      button:hover, .archive-row:hover { background: var(--mark); }

      .status { padding: 12px 0; border-bottom: 1px solid var(--soft-line); }

      .list-head, .archive-row {
        display: grid;
        grid-template-columns: 56px minmax(220px, 2fr) minmax(140px, 1fr) 120px 130px minmax(200px, 1.2fr);
        gap: 12px;
        align-items: center;
      }
      .list-head { min-height: 34px; text-transform: uppercase; }
      .archive-row { min-height: 54px; padding: 8px 0; border-color: var(--soft-line); }

      .work { overflow-wrap: anywhere; text-transform: uppercase; }
      .state { text-transform: uppercase; }
      .state.warn { background: var(--mark); padding: 2px 6px; justify-self: start; }

      .actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .actions a {
        border: 1px solid var(--line);
        padding: 5px 10px;
        text-decoration: none;
        text-transform: uppercase;
        white-space: nowrap;
      }
      .actions a:hover { background: var(--text); color: var(--bg); }
      .actions .none { color: var(--muted); padding: 5px 0; }

      .empty { margin: 0; padding: 28px 0; color: var(--muted); }

      @media (max-width: 760px) {
        .masthead, .toolbar, .list-head, .archive-row { grid-template-columns: 1fr; }
        .summary { text-align: left; }
        label { border-right: 0; border-bottom: 1px solid var(--soft-line); padding-right: 0; }
        button { border-left: 0; border-top: 1px solid var(--line); }
        .list-head { display: none; }
        .archive-row { gap: 4px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="Archive">
        <span>archivve</span>
        <span>
          <a href="play.html">Open a WACZ</a>
          <a id="sheet-link" href="#" target="_blank" rel="noopener" hidden> · Intake sheet</a>
        </span>
      </nav>

      <header class="masthead">
        <div>
          <h1 id="site-title">Web Archive</h1>
          <p class="subtitle" id="site-description"></p>
        </div>
        <div class="summary" aria-live="polite">
          <span id="item-count">0 shown</span>
          <span id="public-count"></span>
        </div>
      </header>

      <section class="toolbar" aria-label="Archive controls">
        <label><span>Search:</span><input id="search" type="search" autocomplete="off" /></label>
        <label>
          <span id="collection-label">Collection:</span>
          <select id="collection"><option value="">All</option></select>
        </label>
        <label>
          <span>Mode:</span>
          <select id="mode">
            <option value="public">Public list</option>
            <option value="all">All rows</option>
          </select>
        </label>
        <button id="reload" type="button">Reload</button>
      </section>

      <p class="status" id="status">Reading manifest.csv…</p>

      <section aria-label="Archived sites">
        <div class="list-head" aria-hidden="true">
          <span>No.</span>
          <span>Title</span>
          <span id="creator-head">Creator</span>
          <span id="collection-head">Collection</span>
          <span>Status</span>
          <span>Links</span>
        </div>
        <div id="archive-list"></div>
        <p class="empty" id="empty-state" hidden>Nothing to show.</p>
      </section>
    </main>

    <script>
      // This page reads only manifest.csv and archivve.json from its own folder.
      // Replay uses a service worker, so serve the folder (`python3 archive.py view`
      // or GitHub Pages) instead of opening this file directly.
      const PUBLIC = ["ok", "partial"];
      const CAPTURE = ["", "pending", "ready-to-capture", "recapture-needed"];
      // Same aliases as tools/manifest.py, so older manifests keep working.
      const ALIASES = {
        creator: ["creator", "student_name", "name", "author", "student"],
        collection: ["collection", "semester", "class", "course"],
        original_url: ["original_url", "url"],
        link: ["link", "drive_link"],
      };

      const state = {
        rows: [],
        query: "",
        collection: "",
        mode: new URLSearchParams(location.search).get("mode") === "all" ? "all" : "public",
      };

      const $ = (id) => document.getElementById(id);
      const list = $("archive-list");
      $("mode").value = state.mode;

      const clean = (value) => String(value || "").trim();

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = "";
        let quoted = false;
        for (let i = 0; i < text.length; i += 1) {
          const char = text[i];
          if (quoted) {
            if (char === '"' && text[i + 1] === '"') { cell += '"'; i += 1; }
            else if (char === '"') quoted = false;
            else cell += char;
          } else if (char === '"') quoted = true;
          else if (char === ",") { row.push(cell); cell = ""; }
          else if (char === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
          else if (char !== "\r") cell += char;
        }
        if (cell || row.length) { row.push(cell); rows.push(row); }

        const headers = (rows.shift() || []).map((h) => clean(h).replace(/^﻿/, ""));
        return rows
          .filter((values) => values.some(clean))
          .map((values) => {
            const raw = {};
            headers.forEach((header, index) => { raw[header] = clean(values[index]); });
            const item = { ...raw };
            for (const [field, names] of Object.entries(ALIASES)) {
              item[field] = names.map((name) => raw[name]).find(clean) || "";
            }
            return item;
          });
      }

      const status = (row) => clean(row.status).toLowerCase();
      const isPublic = (row) => PUBLIC.includes(status(row));

      function slugify(value) {
        let out = "";
        for (const char of String(value).toLowerCase()) {
          if (/\p{L}|\p{N}/u.test(char)) out += char;
          else if (" -_.".includes(char)) out += "-";
        }
        return out.split("-").filter(Boolean).join("-") || "untitled";
      }

      // Same rule as tools/manifest.py: wacz/<collection>/<wacz_file>.
      function waczPath(row) {
        const collection = clean(row.collection) || "uncollected";
        const base = clean(row.creator) || clean(row.title) || clean(row.original_url);
        const file = clean(row.wacz_file) || `${slugify(base)}-${slugify(collection)}.wacz`;
        return `wacz/${collection}/${file}`;
      }

      function playUrl(row) {
        if (!clean(row.wacz_file)) return "";
        if (state.mode !== "all" && !isPublic(row)) return "";
        const params = new URLSearchParams({
          source: waczPath(row),
          url: clean(row.original_url),
          title: clean(row.title) || clean(row.original_url),
          meta: [clean(row.creator), clean(row.collection)].filter(Boolean).join(" · "),
        });
        return `play.html?${params}`;
      }

      function matches(row) {
        if (state.mode !== "all" && !isPublic(row)) return false;
        if (state.collection && clean(row.collection) !== state.collection) return false;
        const q = state.query.toLowerCase();
        const haystack = [row.title, row.creator, row.collection, row.original_url, row.notes, row.status]
          .join(" ")
          .toLowerCase();
        return !q || haystack.includes(q);
      }

      function cell(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text;
        return span;
      }

      function link(label, href) {
        const a = document.createElement("a");
        a.textContent = label;
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener";
        return a;
      }

      function render() {
        const rows = state.rows.filter(matches);
        list.innerHTML = "";
        $("empty-state").hidden = rows.length > 0;
        $("item-count").textContent = `${rows.length} shown`;
        const publicRows = state.rows.filter(isPublic).length;
        const waiting = state.rows.filter((row) => clean(row.original_url) && CAPTURE.includes(status(row))).length;
        $("public-count").textContent =
          state.mode === "all" ? `${publicRows} public / ${waiting} to capture` : `${publicRows} public`;

        rows.forEach((row, index) => {
          const item = document.createElement("div");
          item.className = "archive-row";
          const rowState = status(row) || "pending";
          const stateCell = cell(rowState, "state");
          if (!PUBLIC.includes(rowState)) stateCell.classList.add("warn");

          const actions = cell("", "actions");
          const replay = playUrl(row);
          if (replay) actions.appendChild(link("Archive", replay));
          if (clean(row.original_url)) actions.appendChild(link("Original", clean(row.original_url)));
          if (clean(row.link)) actions.appendChild(link("Link", clean(row.link)));
          if (!actions.childElementCount) actions.appendChild(cell(rowState, "none"));

          item.append(
            cell(String(index + 1).padStart(2, "0")),
            cell(clean(row.title) || clean(row.original_url) || "Untitled", "work"),
            cell(clean(row.creator) || "-"),
            cell(clean(row.collection) || "-"),
            stateCell,
            actions,
          );
          list.appendChild(item);
        });
      }

      function renderCollections() {
        const select = $("collection");
        const current = select.value;
        const values = [...new Set(state.rows.map((row) => clean(row.collection)).filter(Boolean))].sort().reverse();
        select.innerHTML = '<option value="">All</option>';
        for (const value of values) select.add(new Option(value, value));
        select.value = values.includes(current) ? current : "";
        state.collection = select.value;
      }

      function applyConfig(config) {
        const title = clean(config.title) || "Web Archive";
        document.title = title;
        $("site-title").textContent = title;
        $("site-description").textContent = clean(config.description);
        const labels = config.labels || {};
        if (labels.creator) $("creator-head").textContent = labels.creator;
        if (labels.collection) {
          $("collection-head").textContent = labels.collection;
          $("collection-label").textContent = `${labels.collection}:`;
        }
        // The intake sheet is an operator tool, so it shows only in "All rows" mode.
        if (clean(config.intake_sheet) && state.mode === "all") {
          $("sheet-link").href = clean(config.intake_sheet);
          $("sheet-link").hidden = false;
        }
      }

      async function load() {
        $("status").textContent = "Reading manifest.csv…";
        try {
          const config = await fetch("archivve.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : {}));
          applyConfig(config);
        } catch {
          applyConfig({});
        }
        try {
          const response = await fetch("manifest.csv", { cache: "no-store" });
          if (!response.ok) throw new Error();
          state.rows = parseCsv(await response.text());
          $("status").textContent = `Read ${state.rows.length} row(s) from manifest.csv.`;
        } catch {
          state.rows = [];
          $("status").textContent =
            "Could not read manifest.csv. Serve this folder with `python3 archive.py view` instead of opening the file directly.";
        }
        renderCollections();
        render();
      }

      $("search").addEventListener("input", (event) => { state.query = event.target.value; render(); });
      $("collection").addEventListener("change", (event) => { state.collection = event.target.value; render(); });
      $("mode").addEventListener("change", (event) => {
        state.mode = event.target.value;
        const next = new URL(location.href);
        if (state.mode === "all") next.searchParams.set("mode", "all");
        else next.searchParams.delete("mode");
        history.replaceState(null, "", next);
        load();
      });
      $("reload").addEventListener("click", load);

      load();
    </script>
  </body>
</html>
